name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Load environment / NVM so node, npm, and pm2 are available
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node 2>/dev/null | tail -n 1)/bin:/usr/local/bin:/usr/bin

            cd ~/curd-op
            git pull origin main

            # Backend
            cd backend
            npm ci
            npx prisma generate
            pm2 restart backend || pm2 start src/server.js --name backend

            # Frontend
            cd ../frontend
            npm ci
            npm run build
            pm2 restart frontend || pm2 start npm --name frontend -- start

            # Save PM2 state
            pm2 save
